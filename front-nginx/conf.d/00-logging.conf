# Access-log format for GoAccess reports. Records the REAL visitor IP from Cloudflare
# (traffic arrives via the tunnel, so $remote_addr is cloudflared, not the visitor) and the $host,
# so GoAccess can produce accurate, per-site reports. This file sits in http{} context (conf.d is
# included there), so the log_format is defined once for all server blocks.
log_format cf '$http_cf_connecting_ip - $remote_user [$time_local] '
              '"$request" $status $body_bytes_sent '
              '"$http_referer" "$http_user_agent" host=$host';

# All partner traffic → one combined log (GoAccess filters per host via the host= field).
access_log /var/log/nginx/partner-access.log cf;
