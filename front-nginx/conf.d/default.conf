# Default catch-all. Any hostname without a matching partner server block gets 404.
# Per-partner routing blocks (with REAL domains) are added to this dir at onboarding from
# ../../site.template/site.conf.template — never ship a block with a literal {{DOMAIN}} (the braces
# are invalid in server_name and crash nginx).
server {
    listen 80 default_server;
    server_name _;
    return 404;
}
