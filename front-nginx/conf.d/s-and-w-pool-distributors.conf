# S & W Pool Distributors -- sandwpools.com -> site-s-and-w-pool-distributors container.
# TLS terminates at Cloudflare; tunnel->front-nginx->site hops are plain HTTP inside the compose network.

server {
    listen 80;
    server_name www.sandwpools.com;
    return 301 https://sandwpools.com$request_uri;   # www -> apex
}

server {
    listen 80;
    server_name sandwpools.com;

    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://site-s-and-w-pool-distributors:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
