# S & W staging -- staging.sandwpools.com. Gated by Cloudflare Access at the edge (email allowlist);
# reachable only via the tunnel. "/" -> the staging site container; "/api/*" -> the review sidecar.
# The Cf-Access-Authenticated-User-Email header (set by CF Access) is forwarded to the sidecar, which
# 401s without it.

server {
    listen 80;
    server_name staging.sandwpools.com;

    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag             "noindex, nofollow" always;   # never index staging

    location = /api/review.json {
        proxy_pass http://review-sidecar:4321;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
    }
    location = /api/whoami {
        proxy_pass http://review-sidecar:4321;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
    }

    # Top-level visit to the root -> land on the review tool. But the tool frames the real homepage
    # (request has Sec-Fetch-Dest: iframe), so iframe loads of "/" still get the actual site.
    location = / {
        if ($http_sec_fetch_dest != "iframe") { return 302 /review.html; }
        proxy_pass http://site-s-and-w-pool-distributors-staging:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://site-s-and-w-pool-distributors-staging:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
