# Per-site nginx config, mounted into every site container (prod + staging).
# Astro's default `directory` build writes /wholesale/index.html etc., but the site's nav links are
# slash-less (/wholesale). Stock nginx answers a slash-less directory request with a 301 that adds the
# slash -- and because this container only speaks http, that redirect downgrades the scheme to http.
# Inside the https review iframe (and behind the tunnel generally) that dead-ends the click. So:
#   - serve /wholesale directly from /wholesale/index.html via try_files (NO redirect), and
#   - absolute_redirect off, so any redirect that does happen stays relative (keeps https).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;   # never emit an http:// Location behind the https tunnel

    # Clean URLs: /wholesale -> /wholesale/index.html, /about -> /about/index.html, no 301 hop.
    location / {
        try_files $uri $uri/index.html $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
